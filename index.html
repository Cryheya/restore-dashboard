<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>restore — Перформеры</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efeff3;--surface:#fff;--surface2:#f5f5f9;
    --border:#e0e0ea;--text:#13131c;--muted:#9090b0;
    --aplus:#b08800;--a:#049060;--b:#0c5f88;--c:#bb2a4c;
    --gold:#b08800;--silver:#6070a0;--bronze:#8f4a14;
    --warn:#e07000;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;font-size:13px;}

  /* HEADER */
  .hdr{padding:18px 32px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;line-height:1;}
  .logo-sub{display:inline-block;margin-top:3px;background:var(--aplus);color:#fff;font-size:8px;font-weight:800;letter-spacing:2px;padding:2px 7px;border-radius:2px;}
  .hdr-period{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--aplus);line-height:1;text-align:right;}
  .hdr-sub{color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:3px;text-align:right;}

  /* TABS */
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;}
  .tab{padding:10px 18px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;position:relative;transition:color .18s;white-space:nowrap;}
  .tab::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:currentColor;transform:scaleX(0);transition:transform .18s;}
  .tab:hover{color:var(--text);}
  .tab.active::after{transform:scaleX(1);}
  .tab[data-g="aplus"].active{color:var(--aplus);}
  .tab[data-g="a"].active{color:var(--a);}
  .tab[data-g="b"].active{color:var(--b);}
  .tab[data-g="c"].active{color:var(--c);}
  .tab[data-g="near"].active{color:var(--warn);}
  .tab[data-g="all"].active{color:#5060c0;}
  .tab[data-g="hk"].active{color:#c0392b;}
  .tab[data-g="settings"].active{color:#444;}

  /* SETTINGS PAGE */
  .settings-wrap{max-width:600px;margin:0 auto;padding:8px 0 40px;}
  .settings-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px;}
  .settings-card-head{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .settings-card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--text);}
  .settings-card-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
  .settings-row{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-label{flex:1;}
  .settings-label-title{font-weight:700;font-size:12px;margin-bottom:2px;}
  .settings-label-desc{font-size:10px;color:var(--muted);}
  .settings-control{display:flex;align-items:center;gap:8px;}
  .threshold-input{width:72px;padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;text-align:center;outline:none;transition:border-color .15s;}
  .threshold-input:focus{border-color:var(--aplus);}
  .threshold-unit{font-size:11px;font-weight:700;color:var(--muted);}
  .radio-group{display:flex;gap:6px;}
  .radio-btn{padding:6px 14px;border:1px solid var(--border);border-radius:5px;font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;}
  .radio-btn:hover{border-color:var(--muted);color:var(--text);}
  .radio-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
  .settings-preview{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:14px 20px;margin-top:4px;}
  .preview-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);}
  .preview-row:last-child{border-bottom:none;}
  .preview-grade{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;}
  .preview-nums{font-size:11px;color:var(--muted);}
  .preview-nums b{font-weight:800;}
  .apply-btn{width:100%;padding:12px;background:var(--text);color:#fff;border:none;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;transition:opacity .15s;margin-top:16px;}
  .apply-btn:hover{opacity:.85;}

  /* MEDALS */
  .medal{display:inline-flex;align-items:center;gap:3px;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 8px 2px 5px;border-radius:3px;vertical-align:middle;margin-left:4px;}
  .medal-1{background:rgba(176,136,0,.15);color:#8a6800;border:1px solid rgba(176,136,0,.25);}
  .medal-2{background:rgba(96,112,160,.12);color:#4a5680;border:1px solid rgba(96,112,160,.25);}
  .medal-3{background:rgba(143,74,20,.12);color:#7a3a0a;border:1px solid rgba(143,74,20,.25);}
  .medal-icon{font-size:10px;}

  /* RD FILTER */
  .rd-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;}
  .rd-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:4px;}
  .rd-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap;}
  .rd-chip:hover{border-color:var(--muted);}
  .rd-chip.selected{background:var(--text);color:#fff;border-color:var(--text);}

  /* ГОНКОНГ TABLE */
  .hk-head{display:grid;grid-template-columns:36px 1fr 80px 58px 58px 110px 52px 54px 90px;gap:6px;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .hk-head div:not(:nth-child(2)){text-align:right;}
  .hk-row{display:grid;grid-template-columns:36px 1fr 80px 58px 58px 110px 52px 54px 90px;align-items:center;gap:6px;padding:7px 16px;border-bottom:1px solid var(--border);transition:background .1s;}
  .hk-row:last-child{border-bottom:none;}
  .hk-row:hover{background:var(--surface2);}
  .hk-row.hk-perf{background:rgba(192,57,43,.04);}
  .hk-row.hk-perf:hover{background:rgba(192,57,43,.09);}
  .hk-rank-num{font-family:'Bebas Neue',sans-serif;font-size:18px;text-align:right;line-height:1;}
  .hk-r1{color:#c0392b;} .hk-r2{color:#7f8c8d;} .hk-r3{color:#8f4a14;}
  .hk-name{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hk-store{color:var(--muted);font-size:8.5px;}
  .hk-val{text-align:right;font-size:11px;font-weight:600;}
  .hk-badge-wrap{text-align:right;}
  .hk-grade-badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:3px;}
  .hk-perf-badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:3px;background:rgba(192,57,43,.12);color:#c0392b;border:1px solid rgba(192,57,43,.2);}

  /* MAIN */
  .main{padding:20px 32px 40px;max-width:1100px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;animation:fi .2s ease;}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;}
  .ph-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
  .ph-tag{font-size:9px;font-weight:800;letter-spacing:2px;padding:3px 9px;border-radius:2px;}
  .ph-sub{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 15px;position:relative;overflow:hidden;}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
  .sn{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;margin-bottom:2px;}
  .sl{color:var(--muted);font-size:8px;letter-spacing:1px;text-transform:uppercase;}

  /* CONTROLS */
  .ctrl-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:0 0 220px;}
  .search-wrap input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:5px;font-family:'Manrope',sans-serif;font-size:11px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;}
  .search-wrap input:focus{border-color:var(--muted);}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;}
  .reset-btn{padding:6px 14px;border:1px solid var(--border);border-radius:5px;font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--surface);color:var(--muted);cursor:pointer;text-transform:uppercase;transition:all .15s;white-space:nowrap;}
  .reset-btn:hover{border-color:var(--muted);color:var(--text);}
  .toggle-btn{padding:5px 12px;border:1px solid var(--border);border-radius:5px;font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .toggle-btn:hover{border-color:var(--muted);color:var(--text);}
  .result-count{font-size:10px;color:var(--muted);white-space:nowrap;}

  /* STORE CHIPS */
  .chips-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;}
  .chips-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:4px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap;}
  .chip:hover{border-color:var(--muted);}
  .chip.selected{color:#fff;border-color:transparent;}
  .chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .filters-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
  .filters-row > div{min-width:0;}

  /* TWO-COL */
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .ch{padding:10px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .ct{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;}
  .cb{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .thresholds{display:flex;gap:4px;flex-wrap:wrap;}
  .thr{font-size:8px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);}

  /* PERFORMER TABLE */
  .perf-head{display:grid;grid-template-columns:24px 1fr 60px 46px 46px;gap:6px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .perf-head div:not(:nth-child(2)){text-align:right;}

  .pr{display:grid;grid-template-columns:24px 1fr 60px 46px 46px;align-items:center;gap:6px;padding:7px 15px;border-bottom:1px solid var(--border);transition:background .1s;}
  .pr:last-child{border-bottom:none;}
  .pr:hover{background:var(--surface2);}
  .pr.is-perf{background:rgba(176,136,0,.05);}
  .pr.is-perf:hover{background:rgba(176,136,0,.10);}
  .pr.is-near{background:rgba(224,112,0,.03);}
  .pr.is-near:hover{background:rgba(224,112,0,.08);}
  .prk{font-family:'Bebas Neue',sans-serif;font-size:15px;text-align:center;line-height:1;}
  .rg{color:var(--gold);} .rs{color:var(--silver);} .rb{color:var(--bronze);}
  .rn{color:var(--muted);font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;}
  .pn{font-weight:700;font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ps{color:var(--muted);font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pv{text-align:right;}
  .pv .v{font-weight:700;font-size:11px;display:block;}
  .pv .l{color:var(--muted);font-size:7.5px;letter-spacing:.5px;display:block;}
  .no-results{padding:20px 15px;text-align:center;color:var(--muted);font-size:11px;}

  /* STORE TABLE */
  .store-head{display:grid;grid-template-columns:24px 1fr 1fr 56px;gap:6px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .sh-col{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;display:flex;align-items:center;gap:3px;transition:color .15s;}
  .sh-col:hover{color:var(--text);} .sh-col.sorted{color:var(--text);}
  .sh-col-r{justify-content:flex-end;}
  .sort-arrow{font-size:9px;opacity:.5;} .sh-col.sorted .sort-arrow{opacity:1;}
  .sr{display:grid;grid-template-columns:24px 1fr 1fr 56px;align-items:center;gap:6px;padding:7px 15px;border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer;position:relative;}
  .sr:last-child{border-bottom:none;}
  .sr:hover{background:var(--surface2);}
  .sr.sel-store{border-left:3px solid;padding-left:12px;}
  .srk{font-family:'Bebas Neue',sans-serif;font-size:14px;text-align:center;}
  .sn2{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bw{display:flex;align-items:center;gap:5px;}
  .bb{flex:1;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;}
  .bf{height:100%;border-radius:2px;}
  .bv{font-weight:700;font-size:10px;min-width:44px;text-align:right;white-space:nowrap;}
  .store-hint{padding:7px 15px;font-size:9px;color:var(--muted);border-top:1px solid var(--border);text-align:center;letter-spacing:.3px;}

  /* NEAR MISS */
  .nm-section{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;padding:14px 0 8px;display:flex;align-items:center;gap:10px;}
  .nm-count{font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;color:var(--muted);}
  .nm-head{display:grid;grid-template-columns:1fr 110px 65px 65px 65px;gap:6px;padding:6px 15px;border-bottom:1px solid var(--border);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--surface2);}
  .nm-row{display:grid;grid-template-columns:1fr 110px 65px 65px 65px;align-items:center;gap:6px;padding:7px 15px;border-bottom:1px solid var(--border);transition:background .1s;}
  .nm-row:last-child{border-bottom:none;} .nm-row:hover{background:var(--surface2);}
  .nm-name{font-weight:700;font-size:11px;} .nm-store{color:var(--muted);font-size:8.5px;}
  .nm-val{text-align:right;font-size:11px;font-weight:600;color:var(--muted);}
  .nm-val.fail{color:var(--c);font-weight:800;}
  .fail-tag{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:3px;background:rgba(187,42,76,.10);color:var(--c);}

  /* COLOR UTILS */
  .ca{color:var(--aplus);} .caa{color:var(--a);} .cb2{color:var(--b);} .cc2{color:var(--c);}
  .ta{background:rgba(176,136,0,.10);color:var(--aplus);}
  .taa{background:rgba(4,144,96,.10);color:var(--a);}
  .tb{background:rgba(12,95,136,.10);color:var(--b);}
  .tc{background:rgba(187,42,76,.10);color:var(--c);}
  .tnear{background:rgba(224,112,0,.10);color:var(--warn);}
  .tall{background:rgba(80,96,192,.10);color:#5060c0;}

  /* ALL STAFF TABLE */
  .all-grade-section{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;padding:14px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .all-grade-count{font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;color:var(--muted);}
  .all-legend{display:flex;gap:12px;margin-left:auto;align-items:center;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  .all-ctrl{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .all-chips-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;}
  .all-chips-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:4px;}

  .all-head{display:grid;grid-template-columns:36px 1fr 120px 68px 68px 68px 80px;gap:6px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .all-head div:not(:nth-child(2)):not(:nth-child(3)){text-align:right;}
  .all-row{display:grid;grid-template-columns:36px 1fr 120px 68px 68px 68px 80px;align-items:center;gap:6px;padding:6px 15px;border-bottom:1px solid var(--border);transition:background .1s;}
  .all-row:last-child{border-bottom:none;}
  .all-row:hover{background:var(--surface2);}
  .all-row.is-perf{background:rgba(176,136,0,.06);}
  .all-row.is-perf:hover{background:rgba(176,136,0,.11);}
  .all-row.is-near{background:rgba(224,112,0,.04);}
  .all-row.is-near:hover{background:rgba(224,112,0,.09);}
  .all-rank{font-family:'Bebas Neue',sans-serif;font-size:14px;text-align:right;color:var(--muted);line-height:1;}
  .all-name{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .all-store{color:var(--muted);font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .all-val{text-align:right;font-size:11px;font-weight:600;}
  .all-val.dim{color:var(--muted);}
  .all-badge{text-align:right;}
  .badge-perf{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:3px;background:rgba(176,136,0,.15);color:var(--aplus);}
  .badge-near{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:3px;background:rgba(224,112,0,.12);color:var(--warn);}
  .badge-none{display:inline-block;font-size:8px;font-weight:600;padding:2px 7px;border-radius:3px;color:var(--muted);}
  .ba{background:var(--aplus);} .baa{background:var(--a);} .bbb{background:var(--b);} .bcc{background:var(--c);}
  .sa::before{background:var(--aplus);} .saa::before{background:var(--a);}
  .sb::before{background:var(--b);}    .sc::before{background:var(--c);}
  @media (max-width: 900px){
    .filters-row{grid-template-columns:1fr;}
  }

  .footer{text-align:center;padding:14px;color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--border);}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="logo">RESTORE</div><div class="logo-sub">ЭЛЕКТРОНИКА</div></div>
  <div><div class="hdr-period" id="hdr-q">...</div><div class="hdr-sub">Загрузка данных...</div></div>
</div>

<div class="tabs">
  <button class="tab active" data-g="aplus" onclick="showTab('aplus',this)">Грейд A+</button>
  <button class="tab" data-g="a"    onclick="showTab('a',this)">Грейд A</button>
  <button class="tab" data-g="b"    onclick="showTab('b',this)">Грейд B</button>
  <button class="tab" data-g="c"    onclick="showTab('c',this)">Грейд C</button>

  <button class="tab" data-g="hk"   onclick="showTab('hk',this)">🏆 Гонконг</button>

<div class="main">
  <div class="panel active" id="p-aplus"></div>
  <div class="panel" id="p-a"></div>
  <div class="panel" id="p-b"></div>
  <div class="panel" id="p-c"></div>
  <div class="panel" id="p-near"></div>

</div>

<div class="footer">restore electronics</div>



<div id="loading" style="display:flex;position:fixed;inset:0;background:rgba(239,239,243,.94);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;color:#13131c">RESTORE</div>
  <div style="font-size:11px;color:#9090b0;letter-spacing:1px;text-transform:uppercase">Загрузка данных...</div>
  <div style="width:36px;height:36px;border:3px solid #e0e0ea;border-top-color:#b08800;border-radius:50%;animation:spin .8s linear infinite"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
const LABEL={aplus:'A+',a:'A',b:'B',c:'C'};
const CFG={
  aplus:{col:'var(--aplus)',colHex:'#b08800',bar:'ba',tag:'ta',st:'sa',cc:'ca'},
  a:    {col:'var(--a)',    colHex:'#049060',bar:'baa',tag:'taa',st:'saa',cc:'caa'},
  b:    {col:'var(--b)',    colHex:'#0c5f88',bar:'bbb',tag:'tb',st:'sb',cc:'cb2'},
  c:    {col:'var(--c)',    colHex:'#bb2a4c',bar:'bcc',tag:'tc',st:'sc',cc:'cc2'},
};

// ── THRESHOLDS (изменяются на странице настроек) ──
const THRESHOLDS = {
  sbp: 40,       // минимальная доля СБП %
  ata: 60,       // минимальная АТА %
  revMode: 'auto', // 'auto' = средний по грейду | 'manual' = ручной ввод
  revManual: {},   // {aplus: 20, a: 12, b: 9, c: 5} — заполняется вручную
};

function getRevThreshold(g) {
  if (THRESHOLDS.revMode === 'manual' && THRESHOLDS.revManual[g] != null) {
    return THRESHOLDS.revManual[g];
  }
  return PERF[g]?.avg_rev ?? 0;
}

function isPerformer(p, g) {
  return p.с >= THRESHOLDS.sbp && p.а >= THRESHOLDS.ata && p.о >= getRevThreshold(g);
}

function isNearMiss(p, g) {
  const fails = (p.с < THRESHOLDS.sbp ? 1 : 0) + (p.а < THRESHOLDS.ata ? 1 : 0) + (p.о < getRevThreshold(g) ? 1 : 0);
  return fails === 1 && !isPerformer(p, g);
}

// ── STATE ──
const STATE = {};
['aplus','a','b','c'].forEach(g => {
  STATE[g] = { selStores: new Set(), selRD: null, search: '', storeSort: {key:'q',dir:-1}, showPerf: 'all', chipsOpen: false };
});

// ── HELPERS ──
function rk(r) {
  const cl = r===1?'rg':r===2?'rs':r===3?'rb':'rn';
  return `<div class="prk ${cl}">${r}</div>`;
}
function sortArr(arr, key, dir) {
  return [...arr].sort((a,b) => {
    const av=a[key], bv=b[key];
    if(av==null)return 1; if(bv==null)return -1;
    return dir*(av<bv?-1:av>bv?1:0);
  });
}
function esc(s){ return String(s).replace(/'/g,"\\'"); }
function restoreSearchFocus(containerId, value) {
  const root = document.getElementById(containerId);
  if (!root) return;
  const input = root.querySelector('input[type="text"]');
  if (!input) return;
  input.focus();
  const pos = typeof value === 'string' ? value.length : input.value.length;
  input.setSelectionRange(pos, pos);
}

// ── CHIPS (collapsible) ──
function buildChips(g) {
  const c = CFG[g], st = STATE[g];
  const stores = [...new Set(ALL_STAFF[g].map(p=>p.м))].sort();
  const selCount = st.selStores.size;
  const open = st.chipsOpen;
  const chips = stores.map(s => {
    const sel = st.selStores.has(s);
    return `<span class="chip ${sel?'selected':''}"
      style="${sel?`background:${c.colHex};border-color:${c.colHex};`:''}"
      onclick="toggleChip('${g}','${esc(s)}')"
    ><span class="chip-dot" style="${sel?'background:#fff':'background:'+c.colHex}"></span>${s}</span>`;
  }).join('');
  const selLabel = selCount > 0 ? ` · выбрано: ${selCount}` : '';
  return `<div class="chips-wrap" id="chips-${g}" style="cursor:default">
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none" onclick="toggleChips('${g}')">
      <div class="chips-label" style="margin-bottom:0">Фильтр по магазинам${selLabel}</div>
      <span style="font-size:11px;color:var(--muted);font-weight:700;padding:2px 6px">${open?'▲ скрыть':'▼ показать'}</span>
    </div>
    ${open ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">${chips}</div>` : ''}
  </div>`;
}

// ── ALL STAFF TABLE (in grade panel) ──
function renderPerf(g) {
  const c = CFG[g], st = STATE[g];
  let list = ALL_STAFF[g].filter(p => {
    const ms = st.selStores.size === 0 || st.selStores.has(p.м);
    const ss = !st.search || p.н.toLowerCase().includes(st.search.toLowerCase());
    const perf = isPerformer(p, g);
    const ps = st.showPerf === 'all' || perf;
    return ms && ss && ps;
  });
  list = [...list].sort((a,b) => a.р - b.р);

  const perfCount = list.filter(p => isPerformer(p, g)).length;
  const shown = list.length, totalCount = ALL_STAFF[g].length;
  const countHtml = `<span class="result-count">Показано: ${shown} из ${totalCount} · перформеров: ${perfCount}</span>`;

  const rows = list.length === 0
    ? `<div class="no-results">Нет сотрудников по выбранному фильтру</div>`
    : list.map(p => {
        const perf = isPerformer(p, g);
        const near = !perf && isNearMiss(p, g);
        const rowCls = perf ? 'is-perf' : near ? 'is-near' : '';
        const badge = perf ? `<span class="badge-perf">★</span>` : near ? `<span class="badge-near">↑</span>` : '';
        const medal = perf ? medalBadge(p, g) : '';
        return `<div class="pr ${rowCls}" style="${perf?'border-left:3px solid '+c.colHex+';padding-left:13px':''}">
          ${rk(p.р)}
          <div><div class="pn">${p.н} ${badge}${medal}</div><div class="ps">${p.м}</div></div>
          <div class="pv"><span class="v" style="color:${c.col}">${p.о.toFixed(1)} млн</span><span class="l">Оборот</span></div>
          <div class="pv"><span class="v" style="${p.с<THRESHOLDS.sbp?'color:var(--c)':''}">${p.с.toFixed(1)}%</span><span class="l">СБП</span></div>
          <div class="pv"><span class="v" style="${p.а<THRESHOLDS.ata?'color:var(--c)':''}">${p.а.toFixed(1)}%</span><span class="l">АТА</span></div>
        </div>`;
      }).join('');

  const btnAll  = `<button class="toggle-btn ${st.showPerf==='all'?'active':''}"  onclick="setShowPerf('${g}','all')"  style="${st.showPerf==='all'?'background:'+c.colHex+';color:#fff;border-color:'+c.colHex:''}">Все</button>`;
  const btnPerf = `<button class="toggle-btn ${st.showPerf==='perf'?'active':''}" onclick="setShowPerf('${g}','perf')" style="${st.showPerf==='perf'?'background:'+c.colHex+';color:#fff;border-color:'+c.colHex:''}">Только перформеры</button>`;

  return `<div style="display:flex;align-items:center;gap:8px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;">
    <div class="search-wrap" style="flex:1;min-width:140px">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Поиск по имени..." value="${st.search}"
        oninput="onSearch('${g}',this.value)" style="color:${c.colHex}">
    </div>
    <div style="display:flex;gap:4px">${btnAll}${btnPerf}</div>
    ${countHtml}
  </div>
  <div class="perf-head"><div>#</div><div>Сотрудник</div><div>Оборот</div><div>СБП</div><div>АТА</div></div>
  ${rows}`;
}

// ── STORE TABLE ──
function renderStores(g) {
  const c = CFG[g], st = STATE[g];
  const ss = st.storeSort;
  const sorted = sortArr(STORES[g], ss.key, ss.dir);
  const maxQ = STORES[g].reduce((m,s)=>Math.max(m,s.q),0);

  const arw = (key) => {
    if (ss.key!==key) return '<span class="sort-arrow">↕</span>';
    return `<span class="sort-arrow">${ss.dir===1?'↑':'↓'}</span>`;
  };
  const head = `<div class="store-head">
    <div class="sh-col ${ss.key==='r'?'sorted':''}" onclick="sortStores('${g}','r')"># ${arw('r')}</div>
    <div class="sh-col ${ss.key==='м'?'sorted':''}" onclick="sortStores('${g}','м')">Магазин ${arw('м')}</div>
    <div></div>
    <div class="sh-col sh-col-r ${ss.key==='q'?'sorted':''}" onclick="sortStores('${g}','q')">Выручка ${arw('q')}</div>
  </div>`;

  const rows = sorted.map(s => {
    const pct = (s.q/maxQ*100).toFixed(0);
    const sel = st.selStores.has(s.м);
    return `<div class="sr ${sel?'sel-store':''}" style="${sel?`border-left-color:${c.colHex};background:rgba(${hexToRgb(c.colHex)},.04)`:''}"
      onclick="toggleChip('${g}','${esc(s.м)}')">
      <div class="srk ${s.r<=3?c.cc:''}">${s.r}</div>
      <div class="sn2" style="${sel?`color:${c.colHex};font-weight:800`:''}">${s.м}</div>
      <div class="bw"><div class="bb"><div class="bf ${c.bar}" style="width:${pct}%"></div></div></div>
      <div class="bv" style="color:${c.colHex}">${s.q.toFixed(1)} М</div>
    </div>`;
  }).join('');

  return head + rows;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g2},${b}`;
}

// ── FULL PANEL BUILD (first time) ──
function buildPanel(g) {
  const c = CFG[g], {avg_rev} = PERF[g], total = TOTAL[g];
  const staff = ALL_STAFF[g] || [];
  const perfCount = staff.filter(p => isPerformer(p,g)).length;
  const avgS = staff.length ? (staff.reduce((s,p)=>s+p.с,0)/staff.length).toFixed(1) : '—';
  const storeNote = g==='b'?`топ-10 из ${total}`:`все ${total} магазина`;
  const rdBlock = buildRDChips(g, STATE[g], 'grade');

  return `
  <div class="ph"><div class="ph-title">СОТРУДНИКИ ГРЕЙДА</div><span class="ph-tag ${c.tag}">ГРЕЙД ${LABEL[g]}</span></div>
  <div class="ph-sub">${total} магазинов · порог оборота ${avg_rev} млн · перформеры подсвечены</div>
  <div class="stats">
    <div class="stat ${c.st}"><div class="sn ${c.cc}">${staff.length}</div><div class="sl">Всего сотрудников</div></div>
    <div class="stat ${c.st}"><div class="sn ${c.cc}">${perfCount}</div><div class="sl">Перформеров</div></div>
    <div class="stat ${c.st}"><div class="sn ${c.cc}">${avg_rev} М</div><div class="sl">Порог оборота</div></div>
    <div class="stat ${c.st}"><div class="sn ${c.cc}">${avgS}%</div><div class="sl">Средний СБП</div></div>
  </div>

  ${rdBlock ? `<div class="filters-row"><div id="rd-wrap-${g}">${rdBlock}</div><div id="chips-wrap-${g}">${buildChips(g)}</div></div>` : `<div id="chips-wrap-${g}">${buildChips(g)}</div>`}

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
    <button class="reset-btn" onclick="resetFilters('${g}')">✕ Сбросить фильтры</button>
  </div>

  <div class="tgrid">
    <div class="card">
      <div class="ch">
        <div class="ct ${c.cc}">ВСЕ СОТРУДНИКИ · ${staff.length} ЧЕЛ.</div>
        <div class="thresholds"><span class="thr">★ Перформер</span><span class="thr">🏅 Медаль</span><span class="thr">↑ Почти</span></div>
      </div>
      <div id="perf-${g}">${renderPerf(g)}</div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct ${c.cc}">МАГАЗИНЫ ПО ВЫРУЧКЕ</div><div class="cb">${storeNote}</div></div>
      <div id="stores-${g}">${renderStores(g)}</div>
      <div class="store-hint">← клик на магазин добавляет/убирает из фильтра</div>
    </div>
  </div>`;
}

// ── PARTIAL REFRESH ──
function refresh(g) {
  document.getElementById('perf-'+g).innerHTML = renderPerf(g);
  document.getElementById('stores-'+g).innerHTML = renderStores(g);
  document.getElementById('chips-wrap-'+g).innerHTML = buildChips(g);
  // rebuild RD chips if present
  const rdEl = document.getElementById('rd-wrap-'+g);
  if (rdEl) rdEl.innerHTML = buildRDChips(g, STATE[g], 'grade');
}

// ── EVENTS ──
function toggleChip(g, store) {
  const st = STATE[g];
  if (st.selStores.has(store)) st.selStores.delete(store);
  else st.selStores.add(store);
  refresh(g);
}

function toggleChips(g) {
  STATE[g].chipsOpen = !STATE[g].chipsOpen;
  document.getElementById('chips-wrap-'+g).innerHTML = buildChips(g);
}

function setShowPerf(g, val) {
  STATE[g].showPerf = val;
  document.getElementById('perf-'+g).innerHTML = renderPerf(g);
}

function onSearch(g, val) {
  STATE[g].search = val;
  document.getElementById('perf-'+g).innerHTML = renderPerf(g);
  restoreSearchFocus('perf-'+g, val);
}

function sortStores(g, key) {
  const ss = STATE[g].storeSort;
  if (ss.key===key) ss.dir*=-1;
  else { ss.key=key; ss.dir=key==='q'?-1:1; }
  document.getElementById('stores-'+g).innerHTML = renderStores(g);
}

function resetFilters(g) {
  STATE[g].selStores.clear();
  STATE[g].search = '';
  STATE[g].showPerf = 'all';
  STATE[g].chipsOpen = false;
  STATE[g].selRD = null;
  document.getElementById('p-'+g).innerHTML = buildPanel(g);
}

// ── NEAR MISS ──
function buildNearMiss() {
  const grades=['aplus','a','b','c'];
  const colors={aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};
  const failLabel={sbp:'СБП',ata:'АТА',rev:'Оборот'};
  let html=`
  <div class="ph"><div class="ph-title">ПОЧТИ ПЕРФОРМЕРЫ</div><span class="ph-tag tnear">1 КРИТЕРИЙ</span></div>
  <div class="ph-sub">сотрудники, не прошедшие ровно по одному показателю · Q1 2026</div>`;
  grades.forEach(g=>{
    const {avg_rev,list}=NEAR[g], c=CFG[g];
    html+=`<div class="nm-section"><span style="color:${colors[g]}">ГРЕЙД ${LABEL[g]}</span><span class="nm-count">${list.length} чел.</span></div>
    <div class="card" style="margin-bottom:18px">
      <div class="nm-head"><div>Сотрудник / Магазин</div><div style="text-align:right">Оборот</div><div style="text-align:right">СБП %</div><div style="text-align:right">АТА %</div><div style="text-align:right">Не хватает</div></div>`;
    list.forEach(p=>{
      const fS=p.f==='sbp',fA=p.f==='ata';
      const thr=fS?'40%':fA?'60%':`${avg_rev} млн`;
      const act=fS?p.с.toFixed(1)+'%':fA?p.а.toFixed(1)+'%':p.о.toFixed(1)+' млн';
      html+=`<div class="nm-row">
        <div><div class="nm-name">${p.н}</div><div class="nm-store">${p.м}</div></div>
        <div class="nm-val">${p.о.toFixed(1)} млн</div>
        <div class="nm-val ${fS?'fail':''}">${p.с.toFixed(1)}%</div>
        <div class="nm-val ${fA?'fail':''}">${p.а.toFixed(1)}%</div>
        <div style="text-align:right"><span class="fail-tag">${failLabel[p.f]} ${act} / ${thr}</span></div>
      </div>`;
    });
    html+=`</div>`;
  });
  return html;
}


// ── LOAD DATA FROM data.json ──
let PERF={}, STORES={}, NEAR={}, ALL_STAFF={aplus:[],a:[],b:[],c:[]};
let TOTAL={aplus:0,a:0,b:0,c:0};
let HONGKONG=[], RD_MAP={}, MEDAL_TIERS={};

async function loadData() {
  try {
    const r = await fetch('data.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const quarter = d.quarter || '';
    const period  = d.period  || '';
    TOTAL = d.total_stores || TOTAL;
    HONGKONG = d.hongkong || [];
    RD_MAP = d.rd_map || {};
    MEDAL_TIERS = d.medal_tiers || {};
    ['aplus','a','b','c'].forEach(g => {
      PERF[g]      = { avg_rev: d.avgs[g], list: d.performers[g] || [] };
      STORES[g]    = d.stores[g] || [];
      NEAR[g]      = { avg_rev: d.avgs[g], list: d.near_miss[g] || [] };
      ALL_STAFF[g] = d.all_staff[g] || [];
    });
    document.getElementById('hdr-q').textContent = quarter;
    document.querySelector('.hdr-sub').textContent = 'Рейтинг сотрудников и магазинов · ' + period;
    document.title = 'restore — Перформеры ' + quarter;
    document.querySelector('.footer').textContent =
      'restore electronics · ' + quarter + ' · перформеры: СБП ≥ 40%, АТА ≥ 60%, оборот ≥ среднего по грейду';
    ['aplus','a','b','c'].forEach(g => {
      document.getElementById('p-'+g).innerHTML = buildPanel(g);
    });
    document.getElementById('p-near').innerHTML = buildNearMiss();
    document.getElementById('p-all').innerHTML  = buildAllPanel();
    document.getElementById('p-hk').innerHTML   = buildHongkong();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<div style="text-align:center;padding:40px;color:#bb2a4c">' +
      '<b style="font-size:16px">Ошибка загрузки data.json</b><br><br>' +
      '<span style="font-size:12px;color:#9090b0">' + e.message + '</span></div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';
}
// Start data loading after all constants/functions below are initialized.
const ALL_STATE = {
  aplus: { selStores: new Set(), selRD: null, search: '' },
  a:     { selStores: new Set(), selRD: null, search: '' },
  b:     { selStores: new Set(), selRD: null, search: '' },
  c:     { selStores: new Set(), selRD: null, search: '' },
};

function allStores(g) {
  return [...new Set(ALL_STAFF[g].map(p => p.м))].sort();
}

function buildAllChips(g) {
  const st = ALL_STATE[g], c = CFG[g];
  const stores = allStores(g);
  const chips = stores.map(s => {
    const sel = st.selStores.has(s);
    return `<span class="chip ${sel?'selected':''}"
      style="${sel?`background:${c.colHex};border-color:${c.colHex};`:''}"
      onclick="toggleAllChip('${g}','${esc(s)}')"
    ><span class="chip-dot" style="${sel?'background:#fff':'background:'+c.colHex}"></span>${s}</span>`;
  }).join('');
  return `<div class="all-chips-wrap" id="all-chips-${g}">
    <div class="all-chips-label">Фильтр по магазинам</div>${chips}
  </div>`;
}

function renderAllTable(g) {
  const st = ALL_STATE[g], c = CFG[g];
  let list = ALL_STAFF[g].filter(p => {
    const ms = st.selStores.size === 0 || st.selStores.has(p.м);
    const rs = !st.selRD || (RD_MAP[st.selRD]||[]).includes(p.м);
    const ss = !st.search || p.н.toLowerCase().includes(st.search.toLowerCase());
    return ms && rs && ss;
  });

  const total = ALL_STAFF[g].length;
  const shown = list.length;
  const perfCount = list.filter(p => isPerformer(p,g)).length;
  const countHtml = `<span class="result-count">Показано: ${shown} из ${total} · перформеров: ${perfCount}</span>`;

  const rows = list.map(p => {
    const perf = isPerformer(p,g); const near = !perf && isNearMiss(p,g);
    const medal = perf ? medalBadge(p, g) : '';
    const badgeHtml = perf
      ? `<span class="badge-perf">★ Перформер</span>${medal}`
      : near ? `<span class="badge-near">↑ Почти</span>` : `<span class="badge-none">—</span>`;
    return `<div class="all-row ${perf?'is-perf':near?'is-near':''}">
      <div class="all-rank">${p.р}</div>
      <div><div class="all-name">${p.н}</div><div class="all-store">${p.м}</div></div>
      <div class="all-val" style="color:${c.colHex};text-align:right">${p.о.toFixed(1)} млн</div>
      <div class="all-val" style="text-align:right;${p.с<THRESHOLDS.sbp?'color:var(--c)':''}">${p.с.toFixed(1)}%</div>
      <div class="all-val" style="text-align:right;${p.а<THRESHOLDS.ata?'color:var(--c)':''}">${p.а.toFixed(1)}%</div>
      <div class="all-badge">${badgeHtml}</div>
    </div>`;
  }).join('') || `<div class="no-results">Нет сотрудников по выбранному фильтру</div>`;

  return `<div style="display:flex;align-items:center;gap:8px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);">
    <div class="search-wrap" style="flex:1">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Поиск по имени..." value="${st.search}"
        oninput="onAllSearch('${g}',this.value)" style="color:${c.colHex}">
    </div>
    ${countHtml}
  </div>
  <div class="all-head"><div>#</div><div>Сотрудник</div><div style="text-align:right">Оборот</div><div style="text-align:right">СБП %</div><div style="text-align:right">АТА %</div><div style="text-align:right">Статус</div></div>
  ${rows}`;
}

function buildAllPanel() {
  const grades = ['aplus','a','b','c'];
  const colors = {aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};

  let html = `
  <div class="ph"><div class="ph-title">ВСЕ ПРОДАВЦЫ</div><span class="ph-tag tall">ПО ГРЕЙДАМ</span></div>
  <div class="ph-sub">все ранжированные сотрудники · перформеры подсвечены</div>
  <div class="stats" style="margin-bottom:18px;">
    <div class="stat sa"><div class="sn ca">${ALL_STAFF.aplus.length}</div><div class="sl">Сотрудников A+</div></div>
    <div class="stat saa"><div class="sn caa">${ALL_STAFF.a.length}</div><div class="sl">Сотрудников A</div></div>
    <div class="stat sb"><div class="sn cb2">${ALL_STAFF.b.length}</div><div class="sl">Сотрудников B</div></div>
    <div class="stat sc"><div class="sn cc2">${ALL_STAFF.c.length}</div><div class="sl">Сотрудников C</div></div>
  </div>`;

  grades.forEach(g => {
    const c = CFG[g];
    const total = ALL_STAFF[g].length;
    const perfs = ALL_STAFF[g].filter(p => isPerformer(p,g)).length;
    const avg = PERF[g]?.avg_rev || 0;
    const rdBlock = buildRDChips(g, ALL_STATE[g], 'all');
    html += `
    <div class="all-grade-section">
      <span style="color:${colors[g]}">ГРЕЙД ${LABEL[g]}</span>
      <span class="all-grade-count">${total} чел. · ${perfs} перформеров · порог оборота ${avg} млн</span>
      <div class="all-legend">
        <div class="legend-item"><div class="legend-dot" style="background:rgba(176,136,0,.5)"></div>Перформер</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(224,112,0,.4)"></div>Почти</div>
      </div>
    </div>
    ${rdBlock ? `<div class="filters-row"><div>${rdBlock}</div><div id="all-chips-wrap-${g}">${buildAllChips(g)}</div></div>` : `<div id="all-chips-wrap-${g}">${buildAllChips(g)}</div>`}
    <div style="margin-bottom:6px;"><button class="reset-btn" onclick="resetAllFilters('${g}')">✕ Сброс</button></div>
    <div class="card" style="margin-bottom:24px;">
      <div id="all-table-${g}">${renderAllTable(g)}</div>
    </div>`;
  });
  return html;
}

function toggleAllChip(g, store) {
  const st = ALL_STATE[g];
  if (st.selStores.has(store)) st.selStores.delete(store);
  else st.selStores.add(store);
  document.getElementById('all-chips-wrap-'+g).innerHTML = buildAllChips(g);
  document.getElementById('all-table-'+g).innerHTML = renderAllTable(g);
}

function onAllSearch(g, val) {
  ALL_STATE[g].search = val;
  document.getElementById('all-table-'+g).innerHTML = renderAllTable(g);
  restoreSearchFocus('all-table-'+g, val);
}

function allToggleRD(g, rd) {
  ALL_STATE[g].selRD = ALL_STATE[g].selRD === rd ? null : rd;
  if (ALL_STATE[g].selRD) {
    const rdStores = RD_MAP[ALL_STATE[g].selRD] || [];
    ALL_STATE[g].selStores = new Set(ALL_STAFF[g].map(p=>p.м).filter(m => rdStores.includes(m)));
  } else {
    ALL_STATE[g].selStores.clear();
  }
  document.getElementById('p-all').innerHTML = buildAllPanel();
}

function resetAllFilters(g) {
  ALL_STATE[g].selStores.clear();
  ALL_STATE[g].selRD = null;
  ALL_STATE[g].search = '';
  document.getElementById('p-all').innerHTML = buildAllPanel();
}

document.getElementById('p-all').innerHTML = buildAllPanel();

function buildSettingsPanel() {
  const grades = ['aplus','a','b','c'];
  const colors = {aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};

  const revRows = grades.map(g => {
    const autoVal = (PERF[g]?.avg_rev ?? '—');
    const manVal  = THRESHOLDS.revManual[g] ?? autoVal;
    const isMan   = THRESHOLDS.revMode === 'manual';
    return `<div class="preview-row">
      <span class="preview-grade" style="color:${colors[g]}">ГРЕЙД ${LABEL[g]}</span>
      <span class="preview-nums">
        авто: <b>${autoVal} млн</b>
        ${isMan ? `&nbsp;·&nbsp; вручную: <b>${manVal} млн</b>` : ''}
        &nbsp;·&nbsp; сейчас: <b style="color:${colors[g]}">${getRevThreshold(g)} млн</b>
      </span>
    </div>`;
  }).join('');

  const manInputs = grades.map(g => {
    const ph = PERF[g]?.avg_rev ?? 0;
    const val = THRESHOLDS.revManual[g] ?? '';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:${colors[g]};width:40px">Грейд ${LABEL[g]}</span>
      <input class="threshold-input" type="number" min="0" step="0.1"
        placeholder="${ph}" value="${val}"
        oninput="THRESHOLDS.revManual['${g}']=parseFloat(this.value)||null;updateSettingsPreview()">
      <span class="threshold-unit">млн</span>
      <span style="font-size:10px;color:var(--muted)">авто: ${ph} млн</span>
    </div>`;
  }).join('');

  const perfPreview = grades.map(g => {
    const total = ALL_STAFF[g]?.length || 0;
    const perfs = ALL_STAFF[g]?.filter(p => isPerformer(p, g)).length || 0;
    const near  = ALL_STAFF[g]?.filter(p => isNearMiss(p, g)).length || 0;
    return `<div class="preview-row">
      <span class="preview-grade" style="color:${colors[g]}">ГРЕЙД ${LABEL[g]}</span>
      <span class="preview-nums">
        перформеров: <b style="color:${colors[g]}">${perfs}</b> из ${total}
        &nbsp;·&nbsp; почти: <b>${near}</b>
      </span>
    </div>`;
  }).join('');

  const isMan = THRESHOLDS.revMode === 'manual';

  return `
  <div class="ph"><div class="ph-title">НАСТРОЙКИ ПОРОГОВ</div></div>
  <div class="ph-sub">изменения применяются мгновенно ко всем вкладкам</div>
  <div class="settings-wrap">

    <div class="settings-card">
      <div class="settings-card-head">
        <div class="settings-card-title">Пороги СБП и АТА</div>
        <div class="settings-card-sub">Минимальные значения для попадания в перформеры</div>
      </div>
      <div class="settings-row">
        <div class="settings-label">
          <div class="settings-label-title">Доля СБП</div>
          <div class="settings-label-desc">Текущий порог: <b>${THRESHOLDS.sbp}%</b></div>
        </div>
        <div class="settings-control">
          <input class="threshold-input" id="inp-sbp" type="number" min="0" max="100" step="1"
            value="${THRESHOLDS.sbp}"
            oninput="THRESHOLDS.sbp=parseFloat(this.value)||0;updateSettingsPreview()">
          <span class="threshold-unit">%</span>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-label">
          <div class="settings-label-title">АТА</div>
          <div class="settings-label-desc">Текущий порог: <b>${THRESHOLDS.ata}%</b></div>
        </div>
        <div class="settings-control">
          <input class="threshold-input" id="inp-ata" type="number" min="0" max="100" step="1"
            value="${THRESHOLDS.ata}"
            oninput="THRESHOLDS.ata=parseFloat(this.value)||0;updateSettingsPreview()">
          <span class="threshold-unit">%</span>
        </div>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-card-head">
        <div class="settings-card-title">Порог оборота</div>
        <div class="settings-card-sub">Авто = средний оборот по грейду из данных</div>
      </div>
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div class="radio-group">
          <button class="radio-btn ${!isMan?'active':''}" onclick="setRevMode('auto')">Авто (средний)</button>
          <button class="radio-btn ${isMan?'active':''}"  onclick="setRevMode('manual')">Вручную</button>
        </div>
        ${isMan ? `<div style="width:100%">${manInputs}</div>` : `<div class="settings-preview" style="width:100%">${revRows}</div>`}
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-card-head">
        <div class="settings-card-title">Предпросмотр</div>
        <div class="settings-card-sub">Сколько перформеров при текущих порогах</div>
      </div>
      <div style="padding:14px 20px" id="settings-preview">${perfPreview}</div>
    </div>

    <button class="apply-btn" onclick="applyThresholds()">ПРИМЕНИТЬ КО ВСЕМ ВКЛАДКАМ</button>
  </div>`;
}

function updateSettingsPreview() {
  const el = document.getElementById('settings-preview');
  if (!el) return;
  const grades = ['aplus','a','b','c'];
  const colors = {aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};
  el.innerHTML = grades.map(g => {
    const total = ALL_STAFF[g]?.length || 0;
    const perfs = ALL_STAFF[g]?.filter(p => isPerformer(p, g)).length || 0;
    const near  = ALL_STAFF[g]?.filter(p => isNearMiss(p, g)).length || 0;
    return `<div class="preview-row">
      <span class="preview-grade" style="color:${colors[g]}">ГРЕЙД ${LABEL[g]}</span>
      <span class="preview-nums">
        перформеров: <b style="color:${colors[g]}">${perfs}</b> из ${total}
        &nbsp;·&nbsp; почти: <b>${near}</b>
      </span>
    </div>`;
  }).join('');
}

function setRevMode(mode) {
  THRESHOLDS.revMode = mode;
  document.getElementById('p-settings').innerHTML = buildSettingsPanel();
  updateSettingsPreview();
}

function applyThresholds() {
  ['aplus','a','b','c'].forEach(g => {
    document.getElementById('p-'+g).innerHTML = buildPanel(g);
  });
  document.getElementById('p-near').innerHTML = buildNearMiss();
  document.getElementById('p-all').innerHTML  = buildAllPanel();
  document.getElementById('p-hk').innerHTML   = buildHongkong();
  const btn = document.querySelector('.apply-btn');
  if (btn) { btn.textContent = '✓ ПРИМЕНЕНО'; setTimeout(()=>{ btn.textContent = 'ПРИМЕНИТЬ КО ВСЕМ ВКЛАДКАМ'; }, 1500); }
}

// ── MEDAL HELPER ──
function medalBadge(p, g) {
  if (!p.medal) return '';
  const tier = p.medal.tier || 1;
  const cls  = tier === 1 ? 'medal medal-1' : tier === 2 ? 'medal medal-2' : 'medal medal-3';
  const icon = tier === 1 ? '🥇' : tier === 2 ? '🥈' : '🥉';
  return `<span class="${cls}"><span class="medal-icon">${icon}</span>${p.medal.label}</span>`;
}

// ── RD FILTER ──
function buildRDChips(g, stateObj, prefix) {
  const rds = Object.keys(RD_MAP);
  if (!rds.length) return '';
  const sel = stateObj.selRD;
  const chips = rds.map(rd => {
    const isActive = sel === rd;
    return `<span class="rd-chip ${isActive?'selected':''}" onclick="${prefix}ToggleRD('${g}','${esc(rd)}')">${rd.split(' ')[0]}</span>`;
  }).join('');
  return `<div class="rd-wrap">
    <div class="rd-label">Фильтр по РД${sel ? ' · ' + sel : ''}</div>
    ${chips}
  </div>`;
}

function gradeToggleRD(g, rd) {
  STATE[g].selRD = STATE[g].selRD === rd ? null : rd;
  // Apply RD filter: set selStores to RD's stores
  if (STATE[g].selRD) {
    const rdStores = RD_MAP[STATE[g].selRD] || [];
    STATE[g].selStores = new Set(ALL_STAFF[g].map(p=>p.м).filter(m => rdStores.includes(m)));
  } else {
    STATE[g].selStores.clear();
  }
  refresh(g);
}

// ── ГОНКОНГ ──
const HK_STATE = { search: '', selRD: null };

function buildHongkong() {
  const hk = HONGKONG;
  const qualified = hk.filter(p => p.hk_perf);
  const gradeColors = {aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};
  const gradeTags   = {aplus:'A+',a:'A',b:'B',c:'C'};
  const gradeCls    = {aplus:'ta',a:'taa',b:'tb',c:'tc'};

  function renderHKTable() {
    const st = HK_STATE;
    let list = hk.filter(p => {
      const ss = !st.search || p.н.toLowerCase().includes(st.search.toLowerCase());
      const rs = !st.selRD || (RD_MAP[st.selRD]||[]).includes(p.м);
      return ss && rs;
    });
    const shownQual = list.filter(p=>p.hk_perf).length;
    const countHtml = `<span class="result-count">Показано: ${list.length} из ${hk.length} · квалифицировано: ${shownQual}</span>`;
    const rows = list.map(p => {
      const r = p.hk_rank;
      const rkCls = r===1?'hk-r1':r===2?'hk-r2':r===3?'hk-r3':'';
      return `<div class="hk-row ${p.hk_perf?'hk-perf':''}">
        <div class="hk-rank-num ${rkCls}">${r}</div>
        <div><div class="hk-name">${p.н}</div><div class="hk-store">${p.м}</div></div>
        <div class="hk-val" style="color:var(--text)">${p.о.toFixed(1)} млн</div>
        <div class="hk-val" style="${p.с<THRESHOLDS.sbp?'color:var(--c)':''}">${p.с.toFixed(1)}%</div>
        <div class="hk-val" style="${p.а<THRESHOLDS.ata?'color:var(--c)':''}">${p.а.toFixed(1)}%</div>
        <div class="hk-val" style="color:var(--muted)">О:${p.hk_rank_o ?? '—'} · С:${p.hk_rank_s ?? '—'} · А:${p.hk_rank_a ?? '—'}</div>
        <div class="hk-val" style="font-weight:800;color:var(--text)">${p.hk_rank_sum ?? '—'}</div>
        <div class="hk-val"><span class="hk-grade-badge ${gradeCls[p.g]}">${gradeTags[p.g]}</span></div>
        <div class="hk-badge-wrap">${p.hk_perf ? '<span class="hk-perf-badge">★ Квалифицирован</span>' : ''}</div>
      </div>`;
    }).join('') || `<div class="no-results">Нет сотрудников</div>`;

    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;">
      <div class="search-wrap" style="flex:1;min-width:140px">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Поиск по имени..." value="${st.search}"
          oninput="onHKSearch(this.value)" style="color:#c0392b">
      </div>
      ${countHtml}
    </div>
    <div class="hk-head"><div>#</div><div>Сотрудник</div><div>Оборот</div><div>СБП</div><div>АТА</div><div>Места O/C/A</div><div>Σ</div><div>Грейд</div><div>Статус</div></div>
    ${rows}`;
  }

  const rdChips = Object.keys(RD_MAP).map(rd => {
    const isActive = HK_STATE.selRD === rd;
    return `<span class="rd-chip ${isActive?'selected':''}" onclick="hkToggleRD('${esc(rd)}')">${rd.split(' ')[0]}</span>`;
  }).join('');

  const rdBlock = rdChips ? `<div class="rd-wrap" style="margin-bottom:10px">
    <div class="rd-label">Фильтр по РД${HK_STATE.selRD ? ' · ' + HK_STATE.selRD : ''}</div>
    ${rdChips}
  </div>` : '';

  return `
  <div class="ph"><div class="ph-title">ГОНКОНГ</div><span class="ph-tag" style="background:rgba(192,57,43,.10);color:#c0392b">ВСЕ БРЕНДЫ</span></div>
  <div class="ph-sub">рейтинг всех продавцов · порог: СБП ≥ ${THRESHOLDS.sbp}%, АТА ≥ ${THRESHOLDS.ata}% · без порога оборота</div>
  <div class="stats" style="margin-bottom:14px">
    <div class="stat" style="position:relative;overflow:hidden"><div class="stat::before" style="background:#c0392b"></div>
      <div class="sn" style="color:#c0392b">${hk.length}</div><div class="sl">Всего продавцов</div></div>
    <div class="stat"><div class="sn" style="color:#c0392b">${qualified.length}</div><div class="sl">Квалифицировано</div></div>
    <div class="stat"><div class="sn" style="color:var(--muted)">${THRESHOLDS.sbp}%</div><div class="sl">Порог СБП</div></div>
    <div class="stat"><div class="sn" style="color:var(--muted)">${THRESHOLDS.ata}%</div><div class="sl">Порог АТА</div></div>
  </div>
  ${rdBlock}
  <div class="card">
    <div class="ch"><div class="ct" style="color:#c0392b">ОБЩИЙ РЕЙТИНГ · ${hk.length} ПРОДАВЦОВ</div>
    <div style="display:flex;gap:4px"><button class="reset-btn" onclick="resetHKFilters()">✕ Сброс</button></div></div>
    <div id="hk-table">${renderHKTable()}</div>
  </div>`;
}

function onHKSearch(val) {
  HK_STATE.search = val;
  document.getElementById('hk-table').innerHTML = (() => {
    const st = HK_STATE;
    const hk = HONGKONG;
    const gradeColors = {aplus:'var(--aplus)',a:'var(--a)',b:'var(--b)',c:'var(--c)'};
    const gradeTags = {aplus:'A+',a:'A',b:'B',c:'C'};
    const gradeCls  = {aplus:'ta',a:'taa',b:'tb',c:'tc'};
    let list = hk.filter(p => {
      const ss = !st.search || p.н.toLowerCase().includes(st.search.toLowerCase());
      const rs = !st.selRD || (RD_MAP[st.selRD]||[]).includes(p.м);
      return ss && rs;
    });
    const shownQual = list.filter(p=>p.hk_perf).length;
    const countHtml = `<span class="result-count">Показано: ${list.length} из ${hk.length} · квалифицировано: ${shownQual}</span>`;
    const rows = list.map(p => {
      const r=p.hk_rank; const rkCls=r===1?'hk-r1':r===2?'hk-r2':r===3?'hk-r3':'';
      return `<div class="hk-row ${p.hk_perf?'hk-perf':''}">
        <div class="hk-rank-num ${rkCls}">${r}</div>
        <div><div class="hk-name">${p.н}</div><div class="hk-store">${p.м}</div></div>
        <div class="hk-val">${p.о.toFixed(1)} млн</div>
        <div class="hk-val" style="${p.с<THRESHOLDS.sbp?'color:var(--c)':''}">${p.с.toFixed(1)}%</div>
        <div class="hk-val" style="${p.а<THRESHOLDS.ata?'color:var(--c)':''}">${p.а.toFixed(1)}%</div>
        <div class="hk-val" style="color:var(--muted)">О:${p.hk_rank_o ?? '—'} · С:${p.hk_rank_s ?? '—'} · А:${p.hk_rank_a ?? '—'}</div>
        <div class="hk-val" style="font-weight:800;color:var(--text)">${p.hk_rank_sum ?? '—'}</div>
        <div class="hk-val"><span class="hk-grade-badge ${gradeCls[p.g]}">${gradeTags[p.g]}</span></div>
        <div class="hk-badge-wrap">${p.hk_perf?'<span class="hk-perf-badge">★ Квалифицирован</span>':''}</div>
      </div>`;
    }).join('')||`<div class="no-results">Нет сотрудников</div>`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 15px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;">
      <div class="search-wrap" style="flex:1;min-width:140px"><span class="search-icon">🔍</span>
        <input type="text" placeholder="Поиск по имени..." value="${st.search}" oninput="onHKSearch(this.value)" style="color:#c0392b"></div>
      ${countHtml}</div>
    <div class="hk-head"><div>#</div><div>Сотрудник</div><div>Оборот</div><div>СБП</div><div>АТА</div><div>Места O/C/A</div><div>Σ</div><div>Грейд</div><div>Статус</div></div>
    ${rows}`;
  })();
  restoreSearchFocus('hk-table', val);
}

function hkToggleRD(rd) {
  HK_STATE.selRD = HK_STATE.selRD === rd ? null : rd;
  document.getElementById('p-hk').innerHTML = buildHongkong();
}

function resetHKFilters() {
  HK_STATE.search = ''; HK_STATE.selRD = null;
  document.getElementById('p-hk').innerHTML = buildHongkong();
}

function showTab(g, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+g).classList.add('active');
  btn.classList.add('active');
  if (g === 'settings') document.getElementById('p-settings').innerHTML = buildSettingsPanel();
  if (g === 'hk') document.getElementById('p-hk').innerHTML = buildHongkong();
}
loadData();
</script>
